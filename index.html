<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>13번째 방문자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding&display=swap">
<style>
:root{--bg:#050505;--panel:#101010;--gray:#1d1d1d;--line:#2b1010;--red:#7a0a0a;--red2:#b3121b;--tx:#cfc8bd;--dim:#7d766c;--ok:#6f8f6a;
--serif:'Nanum Myeongjo','Gowun Batang','Batang','Noto Serif KR',serif;--body:'Gowun Batang','Nanum Myeongjo',serif;--mono:'Nanum Gothic Coding','Consolas',monospace;--pen:'Nanum Pen Script','Gowun Batang',cursive}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
#app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
#app.shake2{animation:shake 1.1s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px) rotate(-.4deg)}40%,60%{transform:translate(9px,-4px) rotate(.4deg)}}
#app.tear #stage{filter:invert(1) hue-rotate(180deg) contrast(2.2);transform:skewX(7deg) translateX(-2%)}
#app.tear2 #stage{filter:saturate(4) contrast(3) brightness(1.4);transform:skewX(-5deg) translateX(3%) scaleY(1.04)}

/* HUD */
#hud{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:7px 12px;background:linear-gradient(#0e0d0d,#060606);border-bottom:1px solid var(--line);font-size:13px;z-index:20;position:relative}
#hud .chap{font-family:var(--serif);font-weight:800;color:#d9cfc0;letter-spacing:.05em}
#hud .chap small{color:var(--red2);font-weight:700;margin-right:6px}
#hud .clock{font-family:var(--mono);color:var(--red2);background:#140606;border:1px solid #3a0d0d;padding:1px 7px;border-radius:2px;text-shadow:0 0 6px #b3121b88}
#hud .stats{display:flex;gap:10px;font-family:var(--mono);color:var(--dim);font-size:12px;align-items:center}
#hud .stats b{color:var(--tx);font-weight:400}
#hud .stats .o b{color:#8fb38a}#hud .stats .ng b{color:#d24a4a}
#san{width:70px;height:6px;background:#1a1a1a;border:1px solid #333;position:relative;display:inline-block;vertical-align:middle}
#sanFill{position:absolute;inset:0;background:linear-gradient(90deg,#5a0909,#b3121b);transform-origin:left;transition:transform .5s}
#hud .btns{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.hb{background:#151313;color:var(--tx);border:1px solid #352020;padding:4px 9px;font-size:12px;border-radius:2px;transition:.15s;min-height:28px}
.hb:hover{background:#2a0c0c;border-color:var(--red2);color:#fff}
.hb.dis{opacity:.35;pointer-events:none}
#objective{width:100%;font-size:12.5px;color:#a89f92;font-family:var(--body);letter-spacing:.02em}
#objective::before{content:'▸ 현재 목표  ';color:var(--red2)}

/* stage */
#main{flex:1;position:relative;min-height:0;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#000;--mx:50%;--my:50%;--fr:150px;--fd:.6;box-shadow:0 0 0 1px #1a0707,0 0 60px #000 inset}
#parallax{position:absolute;inset:-3%;transition:transform .25s ease-out}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#hotspots{position:absolute;inset:0}
#hotspots.locked{pointer-events:none}
.hs{position:absolute;background:transparent;border:1px dashed transparent;border-radius:3px;padding:0;transition:border-color .2s,background .2s}
.hs:hover,.hs:focus-visible{border-color:rgba(200,60,60,.65);background:rgba(120,0,0,.12);outline:none}
.hs .lbl{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;background:#0b0b0b;border:1px solid #4a1414;color:#e6dccb;font-size:12px;padding:3px 8px;opacity:0;pointer-events:none;transition:.15s;font-family:var(--body)}
.hs:hover .lbl,.hs:focus-visible .lbl{opacity:1}
.hs .dot{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#c22;box-shadow:0 0 10px #f33;animation:pulse 1.6s infinite}
.hs.done .dot{background:#555;box-shadow:none;animation:none;width:7px;height:7px;margin:-3.5px}
.hs.hl{border-color:#ff4444;background:rgba(255,40,40,.18);animation:hl .5s 5 alternate}
.hs.secret{border:none!important;background:none!important}
.hs.secret .lbl{font-size:11px;color:#888}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.2);opacity:1}}
@keyframes hl{to{background:rgba(255,40,40,.02)}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),transparent 0,transparent var(--fr),rgba(0,0,0,var(--fd)) calc(var(--fr)*2.7))}
#dark{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%);mix-blend-mode:multiply}
#redTint{position:absolute;inset:0;pointer-events:none;background:#6b0000;mix-blend-mode:multiply;opacity:0;transition:opacity 1s}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.045;mix-blend-mode:screen;z-index:90}
#scan{position:fixed;inset:0;pointer-events:none;z-index:91;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px)}
#caption{position:absolute;left:14px;bottom:12px;font-style:italic;color:#9a8f85;font-size:13px;text-shadow:0 0 4px #000;pointer-events:none;transition:opacity .6s;opacity:0;max-width:70%}
#toast{position:absolute;right:12px;top:12px;background:rgba(10,4,4,.9);border:1px solid #5a1515;color:#e8d8c8;padding:8px 12px;font-size:13px;pointer-events:none;opacity:0;transform:translateY(-8px);transition:.4s;max-width:60%;z-index:5}
#toast.on{opacity:1;transform:none}

/* dialog */
#dialog{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(920px,96%);background:linear-gradient(rgba(12,8,8,.93),rgba(6,4,4,.96));border:1px solid #3d1212;border-left:3px solid var(--red);padding:14px 18px 22px;font-size:clamp(14px,1.9vw,17px);line-height:1.75;z-index:87;cursor:pointer;display:none;box-shadow:0 10px 40px #000}
#dialog.on{display:block;animation:dlgIn .25s}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,8px)}}
#dlgWho{font-family:var(--serif);font-weight:800;color:var(--red2);font-size:13px;letter-spacing:.1em;margin-bottom:2px;min-height:4px}
#dlgText .r{color:#e03a3a;text-shadow:0 0 8px #900}
#dlgText .q{color:#e9dfcd;font-family:var(--serif)}
#dlgNext{position:absolute;right:14px;bottom:6px;color:var(--red2);font-size:12px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* modals */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:10px}
.modal.on{display:flex}
.card{background:linear-gradient(#141111,#0b0909);border:1px solid #3a1414;box-shadow:0 0 0 4px #0a0505,0 20px 80px #000;max-width:min(760px,100%);width:100%;max-height:96vh;overflow:auto;padding:18px 20px;position:relative}
.card h2{font-family:var(--serif);margin:0 0 4px;font-size:clamp(18px,3vw,24px);color:#e7dcc9;letter-spacing:.04em}
.card .meta{font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.card .meta .lv{color:var(--red2)}
.card .q{font-size:clamp(14.5px,2vw,17px);line-height:1.8;margin:6px 0 12px}
.card .q b{color:#f0d7c0}
.fig{display:flex;justify-content:center;margin:8px 0}
.fig svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}}
.choice{background:#191414;border:1px solid #4a1d1d;color:#eadfcc;font-size:20px;padding:12px 6px;font-family:var(--serif);font-weight:700;transition:.12s}
.choice:hover{background:#2c0e0e;border-color:#c33;transform:translateY(-1px)}
.choice.bad{background:#3a0606;border-color:#f22;color:#f88;animation:shake .4s}
.choice.good{background:#13240f;border-color:#6f8f6a;color:#cfe8c8}
.choice:disabled{pointer-events:none}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{background:#0f0c0a;border-left:2px solid #8a6a2a;padding:8px 12px;font-size:14px;color:#d8c49a;margin-top:8px;line-height:1.6}
.msg{color:#e04545;font-size:14px;min-height:20px;margin-top:6px}
.expl{background:#0c120b;border-left:2px solid var(--ok);padding:10px 14px;margin-top:10px;font-size:14.5px;line-height:1.8;color:#cbd8c4}
.expl b{color:#e8f5dd}
.expl table,.tbl{border-collapse:collapse;margin:6px 0;font-family:var(--mono);font-size:12px}
.expl td,.expl th{border:1px solid #2d3b2a;padding:2px 6px;text-align:center}
.expl td.hit{background:#5a1010;color:#fff}
.btn{background:#2a0b0b;color:#f2e4d2;border:1px solid #8a1d1d;padding:9px 18px;font-size:15px;font-family:var(--serif);font-weight:700;letter-spacing:.05em;transition:.15s}
.btn:hover{background:#4a0e0e;border-color:#e33;box-shadow:0 0 14px #b3121b66}
.btn.ghost{background:transparent;border-color:#444;color:#aaa}
.btn.ghost:hover{border-color:#aaa;color:#fff}
.x{position:absolute;right:10px;top:8px;background:none;border:none;color:#999;font-size:22px}
#puzzle .card{border-top:3px solid var(--red)}
#puzzle .card.shk{animation:shake .45s}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid #444;color:#aaa;margin-right:6px;font-family:var(--mono)}
.tag.t{border-color:#a33;color:#e66}.tag.s{border-color:#8a6a2a;color:#d8b46a}
.clue{border-bottom:1px solid #221;padding:9px 0;font-size:14px;line-height:1.65}
.clue b{color:#eadac2}
.vt-wrap{overflow:auto;max-height:56vh}
table.vt{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
.vt th{background:#1a0d0d;color:#d9b3a6;font-weight:700;padding:6px;border:1px solid #331;position:sticky;top:0}
.vt td{padding:4px 6px;border:1px solid #2a1d1a;text-align:center}
.vt tr:nth-child(even) td{background:#0f0c0b}
.vt .sig{font-family:var(--pen);font-size:21px;color:#b9c4d6;display:inline-block}
.vt .sig.m{transform:scaleX(-1)}
.vt .unk td{color:#c33;font-style:italic}
.tog{border:1px solid #555;background:#141414;color:#bbb;padding:4px 10px;font-size:13px}
.tog.fake{background:#4a0707;border-color:#f33;color:#fff;box-shadow:0 0 10px #f224}

/* overlays */
#scare{position:fixed;inset:0;z-index:100;display:none;background:#000}
#scare.on{display:block}
#scare canvas{width:100%;height:100%;display:block}
#scare.zoom canvas{animation:zoom .7s cubic-bezier(.2,1.6,.4,1) both}
#scare.zoomslow canvas{animation:zoom 1.6s ease-in both}
#scare.trans{background:transparent;pointer-events:none}
@keyframes zoom{from{transform:scale(.55)}to{transform:scale(1.25)}}
#scareText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#d10f0f;font-size:clamp(40px,11vw,150px);text-shadow:0 0 30px #f00,4px 0 #0ff3,-4px 0 #f0f4;pointer-events:none;text-align:center;letter-spacing:.08em}
#redflash{position:fixed;inset:0;z-index:99;pointer-events:none;background:#a00;opacity:0}
#redflash.on{animation:rf .45s}
@keyframes rf{0%{opacity:.85}100%{opacity:0}}
#whiteflash{position:fixed;inset:0;z-index:99;pointer-events:none;background:#fff;opacity:0}
#whiteflash.on{animation:rf .6s}
#fade{position:fixed;inset:0;z-index:80;background:#000;pointer-events:none;opacity:0;transition:opacity .5s}
#fade.on{opacity:1;pointer-events:all}
#fade.cut{transition:none}
#chapCard{position:fixed;inset:0;z-index:85;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000;pointer-events:none}
#chapCard.on{display:flex;animation:cc 3s both}
#chapCard .n{font-family:var(--mono);color:var(--red2);letter-spacing:.5em;font-size:14px}
#chapCard .t{font-family:var(--serif);font-weight:800;font-size:clamp(32px,7vw,64px);color:#e4d9c6;margin-top:10px;text-shadow:0 0 20px #600}
#chapCard .s{color:var(--dim);margin-top:12px;font-size:14px}
@keyframes cc{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
#cctv{position:fixed;inset:0;z-index:40;display:none;background:#000;flex-direction:column;align-items:center;justify-content:center}
#cctv.on{display:flex}
#cctvCv{width:min(100vw,160vh);aspect-ratio:16/10;filter:grayscale(1) contrast(1.3) brightness(1.1) sepia(.25) hue-rotate(60deg);display:block}
#cctvLbl{position:absolute;top:10px;left:14px;font-family:var(--mono);color:#7f7;font-size:13px;text-shadow:0 0 6px #0f0}

/* title */
#title{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#titleCv{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
#title .inner{position:relative;z-index:2}
#title h1{font-family:var(--serif);font-weight:800;font-size:clamp(44px,10vw,112px);margin:0;color:#e9e0d0;letter-spacing:.06em;text-shadow:0 0 28px #8b0000,3px 0 rgba(255,0,0,.4),-3px 0 rgba(0,255,255,.15);animation:tg 6s infinite}
#title h1 span{color:var(--red2)}
@keyframes tg{0%,92%,100%{transform:none;opacity:1}93%{transform:translate(4px,-2px) skewX(10deg);opacity:.6}95%{transform:translate(-6px,1px);opacity:.9}97%{opacity:.2}}
#title .sub{color:#a69c8f;margin:12px 0 30px;font-size:clamp(14px,2.2vw,18px);letter-spacing:.2em}
#title .menu{display:flex;flex-direction:column;gap:10px;align-items:center}
#title .menu .btn{min-width:240px}
#title .warn{margin-top:26px;font-size:12px;color:#6d6359;line-height:1.7}
#pause .card,#confirm .card{text-align:center;max-width:420px}
#pause .col,#confirm .col{display:flex;flex-direction:column;gap:9px;margin-top:14px}
#ending{position:fixed;inset:0;z-index:95;display:none;background:#000}
#ending.on{display:block}
#endCv{position:absolute;inset:0;width:100%;height:100%}
#endText{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(780px,90%);text-align:center;font-family:var(--serif);font-size:clamp(16px,2.6vw,23px);line-height:1.9;color:#e8dfd0;text-shadow:0 0 12px #000,0 0 4px #000}
#endText .ln{opacity:0;transition:opacity 1.4s}
#endText .ln.on{opacity:1}
#endTitle{font-size:clamp(34px,7vw,70px);font-weight:800;letter-spacing:.08em}
#endSkip{position:absolute;right:16px;bottom:14px;color:#888;font-size:12px}
#summary .card{max-width:720px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.sumgrid div{background:#0d0b0b;border:1px solid #2a1515;padding:8px 10px}
.sumgrid small{display:block;color:var(--dim);font-size:11px}
.sumgrid b{font-family:var(--mono);font-size:18px;color:#eadfcc}
.endslots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.endslots div{border:1px solid #333;padding:10px;font-size:13px;background:#0b0b0b;min-height:70px}
.endslots div.got{border-color:#a33;background:#160808}
.endslots b{display:block;font-family:var(--serif);color:#eee}
.endslots .got b{color:#ff6b6b}
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="hide">
    <span class="chap" id="hChap"><small>1장</small>병원 입장</span>
    <span class="clock" id="hClock">23:58</span>
    <span class="stats">
      <span>⏱ <b id="hTime">00:00</b></span>
      <span class="o">정답 <b id="hOk">0</b></span>
      <span class="ng">오답 <b id="hNg">0</b></span>
      <span title="정신력">정신력 <span id="san"><span id="sanFill"></span></span></span>
    </span>
    <span class="btns">
      <button class="hb" id="bClue">단서 <span id="clueN">0</span></button>
      <button class="hb dis" id="bLog">명부</button>
      <button class="hb" id="bHint">힌트</button>
      <button class="hb" id="bPause">일시정지</button>
      <button class="hb" id="bMute">소리 켜짐</button>
      <button class="hb" id="bRestart">다시 시작</button>
    </span>
    <div id="objective">—</div>
  </header>
  <div id="main">
    <div id="stage">
      <div id="parallax"><canvas id="scene"></canvas><div id="hotspots"></div></div>
      <div id="redTint"></div>
      <div id="flash"></div>
      <div id="dark"></div>
      <div id="vign"></div>
      <div id="caption"></div>
      <div id="toast"></div>
    </div>
  </div>
</div>

<div id="title">
  <canvas id="titleCv"></canvas>
  <div class="inner">
    <h1><span>13</span>번째 방문자</h1>
    <div class="sub">매일 밤 12시 13분, 그들이 온다</div>
    <div class="menu">
      <button class="btn" id="tStart">병원에 들어간다</button>
      <button class="btn ghost" id="tEnds">엔딩 수집</button>
      <button class="btn ghost" id="tMute">소리: 켜짐</button>
    </div>
    <div class="warn">헤드폰 착용을 권장합니다 · 갑작스러운 큰 소리, 깜빡이는 화면, 놀라는 장면이 포함됩니다<br>광과민성 발작 위험이 있는 분은 주의하세요 · 플레이 시간 약 20분</div>
  </div>
</div>

<div class="modal" id="puzzle"><div class="card" id="pCard">
  <h2 id="pTitle"></h2>
  <div class="meta"><span class="lv" id="pLv"></span><span id="pCat"></span><span id="pNo"></span></div>
  <div class="q" id="pQ"></div>
  <div class="fig" id="pFig"></div>
  <div class="choices" id="pCh"></div>
  <div class="prow"><button class="hb" id="pHintB">힌트 보기</button><span class="msg" id="pMsg"></span></div>
  <div id="pHint"></div>
  <div id="pEx"></div>
  <div class="prow" style="justify-content:flex-end;margin-top:10px"><button class="btn hide" id="pGo">계속</button></div>
</div></div>

<div class="modal" id="panel"><div class="card" style="max-width:860px"><button class="x" id="panelX">×</button><h2 id="panelT"></h2><div id="panelB"></div></div></div>
<div class="modal" id="verdict"><div class="card" style="max-width:900px"><h2>최종 판정 — 방문자 명부</h2><div id="verdictB"></div></div></div>
<div class="modal" id="pause"><div class="card"><h2>일시정지</h2><div class="meta" style="justify-content:center">병원의 시간이 멈췄다… 정말일까?</div><div class="col">
  <button class="btn" id="pzResume">계속하기</button><button class="btn ghost" id="pzMute">소리 끄기</button><button class="btn ghost" id="pzRestart">처음부터 다시 시작</button><button class="btn ghost" id="pzTitle">타이틀로</button></div></div></div>
<div class="modal" id="confirm" style="z-index:210"><div class="card"><h2>다시 시작할까?</h2><div class="meta" style="justify-content:center">현재 진행 상황은 사라진다. 방문자는 다시 온다.</div><div class="col"><button class="btn" id="cfYes">다시 시작</button><button class="btn ghost" id="cfNo">취소</button></div></div></div>
<div class="modal" id="endsM" style="z-index:75"><div class="card"><button class="x" id="endsX">×</button><h2>엔딩 수집</h2><div id="endsB"></div></div></div>

<script>
'use strict';
/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pad = n => String(n).padStart(2, '0');
const fmtMin = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const fmtTime = s => pad(Math.floor(s / 60)) + ':' + pad(Math.floor(s % 60));

/* 다시 시작 시 진행 중인 모든 연출을 안전하게 중단하기 위한 장치 */
const ABORT = { abort: true };
let GEN = 0;
const pend = new Set();
function guard(executor) {
  const g = GEN;
  return new Promise((res, rej) => {
    const entry = { rej };
    pend.add(entry);
    const wrap = fn => v => { pend.delete(entry); if (g !== GEN) return rej(ABORT); fn(v); };
    executor(wrap(res), wrap(rej));
  });
}
function abortAll() { GEN++; for (const e of pend) e.rej(ABORT); pend.clear(); }
function wait(ms) {
  return guard(res => {
    let left = ms, last = performance.now();
    const id = setInterval(() => {
      const now = performance.now();
      if (!G.paused) left -= now - last;
      last = now;
      if (left <= 0) { clearInterval(id); res(); }
    }, 25);
  });
}
const swallow = e => { if (e !== ABORT) console.error(e); };

/* 저장 (localStorage 실패 시 메모리로 대체) */
const Store = {
  mem: {},
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return this.mem[k] ?? d; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

/* ===================== 사운드 (Web Audio 합성 — 외부 파일 없음) ===================== */
const AU = {
  ctx: null, master: null, muted: false, silent: false, nb: null, amb: {},
  init() {
    if (this.ctx) { if (this.ctx.resume) this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      const ctx = this.ctx = new C();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12; comp.ratio.value = 5;
      this.master = ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(comp); comp.connect(ctx.destination);
      const len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
      this.startAmbient();
    } catch (e) { this.ctx = null; }
  },
  ok() { return !!(this.ctx && this.master && this.ctx.state !== 'closed'); },
  out(pan) {
    if (pan && this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(this.master); return p; }
    return this.master;
  },
  env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;
    try {
      const c = this.ctx, t = c.currentTime + (o.when || 0), a = o.a || 0.01;
      const os = c.createOscillator(); os.type = o.type || 'sine';
      os.frequency.setValueAtTime(f, t);
      if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + a + dur);
      const g = c.createGain(); this.env(g, t, a, o.g || 0.2, dur);
      let n = os;
      if (o.lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); n = fl; }
      n.connect(g); g.connect(this.out(o.pan));
      os.start(t); os.stop(t + a + dur + 0.05);
    } catch (e) { }
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    try {
      const c = this.ctx, t = c.currentTime + (o.when || 0), a = o.a || 0.005;
      const s = c.createBufferSource(); s.buffer = this.nb; s.loop = true;
      const fl = c.createBiquadFilter(); fl.type = o.ft || 'lowpass'; fl.frequency.setValueAtTime(o.f || 1000, t); fl.Q.value = o.q || 1;
      if (o.fto) fl.frequency.exponentialRampToValueAtTime(o.fto, t + a + dur);
      const g = c.createGain(); this.env(g, t, a, o.g || 0.2, dur);
      s.connect(fl); fl.connect(g); g.connect(this.out(o.pan));
      s.start(t, Math.random()); s.stop(t + a + dur + 0.05);
    } catch (e) { }
  },
  startAmbient() {
    const c = this.ctx;
    // 형광등 험 (60Hz 계열)
    const hum = c.createGain(); hum.gain.value = 0.018;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    lp.connect(hum); hum.connect(this.master);
    [60, 120, 180].forEach((f, i) => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f + i * 0.3; const g = c.createGain(); g.gain.value = [1, .45, .2][i]; o.connect(g); g.connect(lp); o.start(); });
    this.amb.hum = hum;
    // 낮은 긴장감 드론
    const dr = c.createGain(); dr.gain.value = 0.05; dr.connect(this.master);
    [41.2, 43.65, 61.74, 87.3].forEach((f, i) => { const o = c.createOscillator(); o.type = i === 3 ? 'triangle' : 'sine'; o.frequency.value = f; const g = c.createGain(); g.gain.value = i === 3 ? .15 : 1; o.connect(g); g.connect(dr); o.start(); });
    const lfo = c.createOscillator(); lfo.frequency.value = 0.06; const lg = c.createGain(); lg.gain.value = 0.02; lfo.connect(lg); lg.connect(dr.gain); lfo.start();
    this.amb.drone = dr;
    // 건물의 공기 소리
    const ns = c.createBufferSource(); ns.buffer = this.nb; ns.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = 0.7;
    const wg = c.createGain(); wg.gain.value = 0.02; ns.connect(bp); bp.connect(wg); wg.connect(this.master); ns.start();
    this.amb.air = wg;
  },
  setTension(x) { if (!this.ok() || !this.amb.drone) return; this.amb.drone.gain.setTargetAtTime(0.035 + 0.1 * clamp(x, 0, 1), this.ctx.currentTime, 1.2); },
  humLevel(v) { if (!this.ok() || !this.amb.hum) return; this.amb.hum.gain.setTargetAtTime(0.02 * v, this.ctx.currentTime, 0.02); },
  applyVol() { if (!this.ok()) return; const t = this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(this.muted || this.silent ? 0 : 0.9, t, 0.02); },
  setMute(m) { this.muted = m; this.applyVol(); },
  silence(ms) { // 갑작스러운 정적
    if (!this.ok()) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.03);
    this.silent = true;
    setTimeout(() => { this.silent = false; this.applyVol(); }, ms);
  },
  footsteps(n = 5, o = {}) {
    let tt = o.when || 0; const pan = o.pan ?? rnd(-.8, .8);
    for (let i = 0; i < n; i++) {
      const g = o.approach ? 0.04 + 0.3 * (i / n) : (o.g || 0.1);
      this.noise(0.08, { f: rnd(380, 650), g, when: tt, pan });
      this.tone(rnd(70, 95), 0.07, { g: g * .9, when: tt, pan, to: 50 });
      tt += rnd(0.4, 0.75) + (Math.random() < .25 ? rnd(.3, .9) : 0); // 불규칙한 발소리
    }
  },
  door(pan) {
    pan = pan ?? rnd(-.9, .9);
    this.tone(rnd(80, 110), 0.9, { type: 'sawtooth', to: rnd(150, 230), g: .03, lp: 900, a: .25, pan });
    this.noise(.4, { f: 180, g: .3, when: 1.0, pan }); this.tone(55, .45, { g: .25, to: 32, when: 1.0, pan });
  },
  slam() { this.noise(.5, { f: 320, g: .95 }); this.tone(48, .7, { g: .9, to: 26 }); this.noise(.15, { ft: 'highpass', f: 2500, g: .25 }); },
  stinger(k = 1) {
    const base = [233.08, 246.94, 277.18, 311.13, 369.99, 415.3];
    base.forEach(f => this.tone(f * k * (1 + rnd(-.012, .012)), 1.5, { type: 'sawtooth', g: .065, a: .004, lp: 4200 }));
    this.noise(.7, { ft: 'highpass', f: 1200, g: .5, a: .003 });
    this.tone(1500 * k, .9, { type: 'sawtooth', to: 280, g: .06, a: .01 });
    this.tone(38, 1.2, { g: .7, to: 24 });
  },
  sting2() { this.tone(110, 1.4, { type: 'square', g: .09, to: 55, lp: 1500 }); this.noise(.5, { ft: 'bandpass', f: 900, fto: 200, g: .35 }); this.tone(36, 1, { g: .5, to: 25 }); },
  bang() { this.noise(.8, { f: 260, g: 1 }); this.tone(40, 1.2, { g: 1, to: 22 }); this.noise(.2, { ft: 'highpass', f: 3000, g: .3 }); },
  knock(n = 3, when = 0, g = .55) { for (let i = 0; i < n; i++) { const w = when + i * 0.3; this.noise(.07, { f: 650, g, when: w }); this.tone(115, .12, { g: g * .8, to: 70, when: w }); } },
  whisper(dur = 1.6, pan) {
    if (!this.ok()) return;
    try {
      const c = this.ctx, t = c.currentTime;
      const s = c.createBufferSource(); s.buffer = this.nb; s.loop = true;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 2.2;
      const g = c.createGain(); g.gain.setValueAtTime(0, t);
      for (let x = 0; x < dur; x += 0.06) g.gain.linearRampToValueAtTime(Math.random() < .3 ? 0 : rnd(.04, .2), t + x);
      g.gain.linearRampToValueAtTime(0, t + dur);
      s.connect(bp); bp.connect(g); g.connect(this.out(pan ?? rnd(-1, 1)));
      s.start(t); s.stop(t + dur + .1);
    } catch (e) { }
  },
  ring() { for (let r = 0; r < 2; r++) { const w = r * 1.0; for (let k = 0; k < 8; k++) { this.tone(440, .045, { g: .07, when: w + k * .05, type: 'square', lp: 2200 }); this.tone(480, .045, { g: .07, when: w + k * .05, type: 'square', lp: 2200 }); } } },
  heartbeat(n = 4, gap = .8) { for (let i = 0; i < n; i++) { this.tone(56, .14, { g: .55, when: i * gap, to: 40 }); this.tone(50, .14, { g: .38, when: i * gap + .24, to: 38 }); } },
  staticBurst(d = .6, g = .25) { this.noise(d, { ft: 'highpass', f: 900, g, a: .004 }); },
  chime() { this.tone(659.3, .9, { g: .1 }); this.tone(523.3, 1.3, { g: .1, when: .5 }); },
  ding() { this.tone(1046.5, 1.4, { g: .1 }); this.tone(2093, .7, { g: .025 }); },
  beep() { this.tone(988, .07, { g: .022 }); },
  unlock() { this.noise(.05, { ft: 'bandpass', f: 3000, g: .35 }); this.tone(1300, .06, { g: .06, when: .08, type: 'square', lp: 3000 }); this.noise(.06, { f: 900, g: .3, when: .12 }); },
  wrongS() { this.tone(98, .6, { type: 'sawtooth', g: .16, to: 52, lp: 900 }); this.tone(104, .6, { type: 'sawtooth', g: .12, to: 55, lp: 900 }); },
  whoosh() { this.noise(.55, { ft: 'bandpass', f: 300, fto: 2600, q: 1.4, g: .45, a: .18 }); },
  scream() { this.tone(820, 1.1, { type: 'sawtooth', to: 1650, g: .07, a: .05, lp: 3200 }); this.tone(860, 1.1, { type: 'sawtooth', to: 1500, g: .05, a: .08, lp: 3000 }); },
  drip() { this.tone(1400, .08, { to: 420, g: .05 }); },
  creak() { this.tone(rnd(70, 95), 1.6, { type: 'sawtooth', to: rnd(120, 170), g: .025, lp: 700, a: .4 }); },
  boom() { this.tone(32, 2.5, { g: .6, a: .05, to: 26 }); this.noise(1.5, { f: 120, g: .3, a: .05 }); }
};

/* ===================== 게임 상태 ===================== */
let G;
function newState() {
  return {
    running: false, paused: false, busy: false, chapter: 0, scene: 'lobby', clock: '23:58',
    playTime: 0, correct: 0, wrong: 0, hints: 0, scares: 0, sanity: 100, corruption: 0,
    clues: [], fragments: new Set(), solved: new Set(), seen: new Set(), arrived: 0,
    visitors: [], deceased: [], figs: [], fx: [], hs: [],
    light: 1, baseLight: 1, forcedDark: false, darkLevel: 0, flick: 0, flickLv: 1,
    lamps: [1, 1, 1, 1, 1, 1], ambientT: 22, scareT: 120, beepT: 2,
    logUnlocked: false, wrongQ: [], flags: {}, scrawl: genScrawl(), ending: null, fd: .6
  };
}
function genScrawl() {
  const words = ['13', '열지 마', '돌아가', '나가', '13', '여기 있어', '봤어?', '13', '거짓말', '하나 더'];
  return shuffle(words).map(t => ({ t, x: rnd(.04, .9), y: rnd(.08, .62), s: rnd(.035, .07), r: rnd(-.35, .35) }));
}

/* ===================== 방문자 생성 (매 회차 랜덤) ===================== */
const NAMES = ['김민지', '이서준', '박하은', '최도윤', '정수아', '강지호', '조예린', '윤태민', '장서연', '임건우', '한소율', '오지훈', '서다인', '신우진', '권나래', '황민혁', '안채원', '송현우', '류지안', '배윤서'];
const PATIENTS = ['문경자', '허만석', '남궁옥', '변춘식', '석미란', '염태호', '진순례', '하봉수', '도말순', '국영철', '편금자', '추병길', '엄정희', '탁용배', '구분이', '설학수', '모정애', '피동춘'];
const RELS = ['딸', '아들', '어머니', '아버지', '남편', '아내', '동생', '손녀', '손자', '조카', '친구', '형', '누나', '언니'];
const NOTES = ['젖은 우산을 들고 옴', '국화 한 송이를 들고 옴', '말이 거의 없음', '계속 손목시계를 봄', '손이 몹시 차가움', '낡은 사진을 쥐고 있음', '기침이 잦음', '슬리퍼 차림', '안경에 김이 서려 있음', '목에 붕대를 감음', '신발이 진흙투성이', '같은 질문을 두 번 함'];
const TELLS = {
  floor: { name: '존재하지 않는 층', desc: '4층 병실을 방문했다 — 청운병원에는 4층이 없다.' },
  time: { name: '불가능한 도착 시각', desc: '00:13 이전에 도착했다 — 정문은 00:13에 처음 열린다.' },
  dead: { name: '이미 죽은 환자', desc: '13년 전 화재로 사망한 환자를 면회하러 왔다.' },
  mirror: { name: '뒤집힌 서명', desc: '서명이 거울에 비친 것처럼 뒤집혀 있다.' },
  shadow: { name: '그림자 없음', desc: 'CCTV에 그림자가 찍히지 않았다.' }
};
function genVisitors() {
  const names = shuffle(NAMES), pats = shuffle(PATIENTS), notes = shuffle(NOTES);
  const r3 = shuffle([...Array(12)].map((_, i) => 301 + i)), r5 = shuffle([...Array(13)].map((_, i) => 501 + i));
  const base = [13, 17, 22, 28, 35, 49, 56, 64, 73, 85, 135, 152];
  const vs = base.map((m, i) => ({
    n: i + 1, name: names[i], rel: pick(RELS), patient: pats[i],
    room: Math.random() < .5 ? r3.pop() : r5.pop(),
    time: fmtMin(i ? m + ri(0, 2) : 13), note: notes[i], mirror: false, fake: false, tell: null
  }));
  const fakeIdx = shuffle([...Array(12).keys()]).slice(0, 3).sort((a, b) => a - b);
  const tells = shuffle(Object.keys(TELLS)).slice(0, 3);
  const deceased = [pats[12], pats[13]];
  fakeIdx.forEach((k, j) => {
    const v = vs[k]; v.fake = true; v.tell = tells[j];
    if (v.tell === 'floor') v.room = 400 + ri(1, 13);
    if (v.tell === 'time') v.time = '00:0' + ri(1, 9);
    if (v.tell === 'dead') deceased.push(v.patient);
    if (v.tell === 'mirror') v.mirror = true;
    if (v.tell === 'shadow') v.note = 'CCTV 판독: 그림자 없음';
  });
  if (deceased.length < 3) deceased.push(pats[14]);
  G.visitors = vs; G.deceased = shuffle(deceased);
}

/* ===================== 그리기: 형체 · 얼굴 · 손자국 ===================== */
function drawFigure(c, x, yb, H, o = {}) {
  c.save();
  c.globalAlpha = o.alpha ?? 1;
  c.fillStyle = o.color || '#020202';
  c.shadowColor = 'rgba(0,0,0,.95)'; c.shadowBlur = H * 0.06;
  const hw = H * 0.11, tl = o.tilt || 0;
  c.beginPath(); c.ellipse(x + tl * H * .04, yb - H * .9, H * .055, H * .072, tl, 0, Math.PI * 2); c.fill();
  c.beginPath();
  c.moveTo(x - H * .03, yb - H * .83); c.lineTo(x - hw, yb - H * .77);
  c.lineTo(x - hw * 1.32, yb - H * .22); c.lineTo(x - hw * 1.12, yb - H * .21);
  c.lineTo(x - hw * .86, yb - H * .6); c.lineTo(x - hw * .76, yb - H * .42);
  c.lineTo(x - hw * .62, yb); c.lineTo(x - hw * .36, yb); c.lineTo(x - hw * .08, yb - H * .42);
  c.lineTo(x + hw * .08, yb - H * .42); c.lineTo(x + hw * .36, yb); c.lineTo(x + hw * .62, yb);
  c.lineTo(x + hw * .76, yb - H * .42); c.lineTo(x + hw * .86, yb - H * .6);
  c.lineTo(x + hw * 1.12, yb - H * .21); c.lineTo(x + hw * 1.32, yb - H * .22);
  c.lineTo(x + hw, yb - H * .77); c.lineTo(x + H * .03, yb - H * .83); c.closePath(); c.fill();
  if (o.eyes) {
    c.shadowBlur = H * .03; c.shadowColor = o.eyeColor || '#fff'; c.fillStyle = o.eyeColor || '#f4f0e6';
    const ey = yb - H * .905, ex = x + tl * H * .04;
    c.beginPath(); c.arc(ex - H * .02, ey, Math.max(1, H * .006), 0, 7); c.arc(ex + H * .02, ey, Math.max(1, H * .006), 0, 7); c.fill();
  }
  c.restore();
}
function drawHand(c, x, y, s, rot, a = .85) {

const SCENES = { lobby: drawLobby, lobbyRed: drawLobby, office: drawOffice, corridor: drawCorridor, basement: drawBasement };

/* ===================== 엔진: 화면 크기 · 렌더 루프 ===================== */
const UI = { dlgClick: null, onChoice: null, capT: null, toastT: null };
const stage = $('#stage'), sceneCv = $('#scene'), sctx = sceneCv.getContext('2d');
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.max(2, Math.round(r.width * dpr)), H = Math.max(2, Math.round(r.height * dpr));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
}
function layout() {
  const m = $('#main').getBoundingClientRect();
  let w = m.width, h = w / 1.6;
  if (h > m.height) { h = m.height; w = h * 1.6; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--fr', Math.max(70, w * .13) + 'px');
}
window.addEventListener('resize', layout);

let lastT = performance.now(), hudAcc = 0, noiseFrame = 0;
function loop(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  if (++noiseFrame % 2 === 0) { updateNoise(); drawGrain(); }
  if (G.running && !G.paused) { G.playTime += dt; ambient(dt); }
  lights(dt);
  if (G.running) {
    fit(sceneCv);
    const w = sceneCv.width, h = sceneCv.height;
    sctx.clearRect(0, 0, w, h);
    try { (SCENES[G.scene] || drawLobby)(sctx, w, h, t); } catch (e) { sctx.fillStyle = '#080808'; sctx.fillRect(0, 0, w, h); }
    G.fx = G.fx.filter(f => { const p = (now - f.t0) / f.dur; if (p >= 1) return false; try { f.draw(sctx, w, h, p, t); } catch (e) { } return true; });
    hudAcc += dt; if (hudAcc > .25) { hudAcc = 0; hud(); }
  }
  if (!$('#title').classList.contains('hide')) drawTitle(t);
  requestAnimationFrame(loop);
}
const grainCv = $('#grain'), gctx = grainCv.getContext('2d');
function drawGrain() { gctx.drawImage(noiseCv, ri(0, 40), ri(0, 20), 160, 100, 0, 0, 160, 100); }
const titleCv = $('#titleCv'), tctx = titleCv.getContext('2d');
function drawTitle(t) {
  fit(titleCv); const w = titleCv.width, h = titleCv.height;
  const show = Math.sin(t * .5) > .85;
  drawCorridor(tctx, w, h, t, { cctv: true, figs: show ? [{ x: .5, yb: .6, h: .22, eyes: true, alpha: .9 }] : [] });
  if (Math.random() < .05) { tctx.fillStyle = 'rgba(0,0,0,.8)'; tctx.fillRect(0, 0, w, h); }
}

function lights(dt) {
  const p = .003 + G.corruption * .02;
  if (G.flick > 0) G.flick -= dt; else if (Math.random() < p) { G.flick = rnd(.05, .25); G.flickLv = rnd(.05, .55); if (Math.random() < .3) AU.noise(.05, { ft: 'highpass', f: 3000, g: .04 }); }
  let L = G.baseLight * (G.flick > 0 ? G.flickLv : 1);
  if (G.forcedDark) L = G.darkLevel;
  G.light += (L - G.light) * Math.min(1, dt * 35);
  $('#dark').style.opacity = clamp(1 - G.light, 0, 1).toFixed(3);
  AU.humLevel(G.light);
  for (let i = 0; i < G.lamps.length; i++) {
    if (Math.random() < .004 + G.corruption * .012) G.lamps[i] = rnd(0, .4);
    else G.lamps[i] += (1 - G.lamps[i]) * dt * 3;
    if (G.chapter >= 3 && i === 3) G.lamps[i] = Math.random() < .1 ? .9 : .05;
  }
}

/* 무작위 배경 이벤트: 발소리, 먼 문소리, 기계음, 그리고 가끔 예고 없는 점프스케어 */
function ambient(dt) {
  if (G.scene !== 'none') {
    G.beepT -= dt; if (G.beepT <= 0 && G.chapter !== 4) { AU.beep(); G.beepT = G.flags.beepStop ? 99 : 1.4; }
  }
  if (G.busy || anyModal()) return;
  G.ambientT -= dt;
  if (G.ambientT <= 0) {
    G.ambientT = rnd(16, 34);
    const ev = pick(['steps', 'steps', 'door', 'whisper', 'knock', 'creak', 'drip']);
    if (ev === 'steps') { AU.footsteps(ri(4, 8), { approach: Math.random() < .5 }); cap(pick(['(어딘가에서 발소리가 들린다)', '(위층 복도를 걷는 소리)', '(발소리가… 멈췄다)'])); }
    if (ev === 'door') { AU.door(); cap('(멀리서 문이 닫히는 소리)'); }
    if (ev === 'whisper') { AU.whisper(1.4); cap('(속삭이는 소리)'); }
    if (ev === 'knock') { AU.knock(ri(2, 4), 0, .25); cap('(어딘가에서 노크 소리)'); }
    if (ev === 'creak') { AU.creak(); cap('(바닥이 삐걱거린다)'); }
    if (ev === 'drip') { for (let i = 0; i < 4; i++) setTimeout(() => AU.drip(), i * 700); cap('(물방울 떨어지는 소리)'); }
  }
  G.scareT -= dt;
  if (G.scareT <= 0 && G.chapter >= 2) {
    G.scareT = rnd(95, 150);
    G.busy = true; lockHs();

}

/* 마우스 = 손전등 + 시점 이동 */
function aim(x, y) {
  const r = stage.getBoundingClientRect(); if (!r.width) return;
  const px = clamp((x - r.left) / r.width, 0, 1), py = clamp((y - r.top) / r.height, 0, 1);
  stage.style.setProperty('--mx', (px * 100).toFixed(1) + '%'); stage.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  $('#parallax').style.transform = `translate(${(.5 - px) * 2.2}%, ${(.5 - py) * 1.6}%)`;

const CH_NAMES = ['', '병원 입장', '첫 번째 방문자', '이상 현상', '13번째 방문자', '최종 선택'];
function hud() {
  $('#hChap').innerHTML = `<small>${G.chapter}장</small>${CH_NAMES[G.chapter] || ''}`;
  $('#hClock').textContent = G.clock;
  $('#hTime').textContent = fmtTime(G.playTime);
  $('#hOk').textContent = G.correct; $('#hNg').textContent = G.wrong;
  $('#sanFill').style.transform = `scaleX(${G.sanity / 100})`;
  $('#clueN').textContent = G.clues.length + G.fragments.size;
  $('#bLog').classList.toggle('dis', !G.logUnlocked);
  const s = G.sanity;
  stage.style.filter = s < 60 ? `contrast(${1 + (60 - s) / 120}) saturate(${1 - (60 - s) / 120})` : '';
  AU.setTension((100 - s) / 100 * .6 + G.corruption * .5);
}
function setObjective(t) { $('#objective').textContent = t; G.objective = t; }
function sanity(d) { G.sanity = clamp(G.sanity + d, 5, 100); hud(); }

/* ===================== 자막 · 알림 ===================== */
function cap(t) { const e = $('#caption'); e.textContent = t; e.style.opacity = 1; clearTimeout(UI.capT); UI.capT = setTimeout(() => e.style.opacity = 0, 2800); }
function toast(t) { const e = $('#toast'); e.innerHTML = t; e.classList.add('on'); clearTimeout(UI.toastT); UI.toastT = setTimeout(() => e.classList.remove('on'), 3200); }

/* ===================== 대사 ===================== */
const strip = s => s.replace(/\{\/?[rq]\}/g, '');
const fmtTxt = s => s.replace(/\{r\}/g, '<span class="r">').replace(/\{q\}/g, '<span class="q">').replace(/\{\/[rq]\}/g, '</span>');
function say(text, who = '') {
  return guard(res => {
    const d = $('#dialog'); d.classList.add('on'); $('#dlgWho').textContent = who;
    const el = $('#dlgText'), plain = strip(text); el.textContent = ''; $('#dlgNext').style.visibility = 'hidden';
    let i = 0, typing = true;
    const id = setInterval(() => { if (G.paused) return; i += 1; el.textContent = plain.slice(0, i); if (i >= plain.length) finish(); }, 26);
    function finish() { clearInterval(id); typing = false; el.innerHTML = fmtTxt(text); $('#dlgNext').style.visibility = 'visible'; }
    UI.dlgClick = () => { if (typing) { finish(); return; } UI.dlgClick = null; d.classList.remove('on'); res(); };
  });
}
async function narr(lines, who = '') { for (const l of lines) await say(l, who); }
$('#dialog').addEventListener('click', e => { e.stopPropagation(); UI.dlgClick && UI.dlgClick(); });

/* ===================== 조사 지점 ===================== */
function setHotspots(list) { G.hs = list; renderHs(); }
function renderHs() {
  const box = $('#hotspots'); box.innerHTML = '';
  for (const h of G.hs) {
    if (h.cond && !h.cond()) continue;
    const b = document.createElement('button');
    b.className = 'hs' + (h.secret ? ' secret' : '') + (h.done && h.done() ? ' done' : '');
    Object.assign(b.style, { left: h.x * 100 + '%', top: h.y * 100 + '%', width: h.w * 100 + '%', height: h.h * 100 + '%' });
    b.innerHTML = (h.secret ? '' : '<span class="dot"></span>') + `<span class="lbl">${h.label}</span>`;
    b.setAttribute('aria-label', h.label); b.dataset.id = h.id;
    b.addEventListener('click', e => { e.stopPropagation(); clickHs(h); });
    box.appendChild(b);
  }
  lockHs();
}
function lockHs() { $('#hotspots').classList.toggle('locked', G.busy); }
async function clickHs(h) {
  if (G.busy || G.paused || !G.running) return;
  G.busy = true; lockHs(); AU.init();
  try { await h.fn(h); } catch (e) { swallow(e); return; }
  G.busy = false; renderHs();
}
const fromQuad = (s, d1, d2, v1, v2) => bbox(quad(s, d1, d2, v1, v2));

async function fadeOut(ms = 500) { const f = $('#fade'); f.classList.remove('cut'); f.style.transitionDuration = ms + 'ms'; f.classList.add('on'); await wait(ms); }
async function fadeIn(ms = 600) { const f = $('#fade'); f.classList.remove('cut'); f.style.transitionDuration = ms + 'ms'; f.classList.remove('on'); await wait(ms); }
function cutBlack(on) { const f = $('#fade'); f.classList.add('cut'); f.classList.toggle('on', on); }
async function chapterCard(n, t, s) {
  const c = $('#chapCard'); $('#ccN').textContent = `CHAPTER ${n}`; $('#ccT').textContent = t; $('#ccS').textContent = s;
  c.classList.remove('on'); void c.offsetWidth; c.classList.add('on'); AU.boom();
  await wait(3000); c.classList.remove('on');
}
function setScene(name, opt = {}) {
  G.scene = name;
  G.fd = opt.fd ?? .6; stage.style.setProperty('--fd', G.fd);
  G.baseLight = opt.light ?? 1;
  $('#redTint').style.opacity = name === 'lobbyRed' ? .35 : 0;
}
function shake(big) { const a = $('#app'); a.classList.remove('shake', 'shake2'); void a.offsetWidth; a.classList.add(big ? 'shake2' : 'shake'); setTimeout(() => a.classList.remove('shake', 'shake2'), 1200); }
function flashRed() { const e = $('#redflash'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); }
function flashWhite() { const e = $('#whiteflash'); e.classList.remove('on'); void e.offsetWidth; e.classList.add('on'); }

function addClue(id, title, text, kind = '일반') {
  if (G.clues.find(c => c.id === id)) return;
  G.clues.push({ id, title, text, kind }); AU.unlock();
  toast(`<span class="tag ${kind === '판별' ? 't' : ''}">${kind}</span> 단서 획득: <b>${title}</b>`); hud();
}

async function findFragment(id) {
  if (G.fragments.has(id)) { await say('이미 확인한 곳이다. 생각하고 싶지 않다.'); return; }
  G.fragments.add(id); AU.tone(220, 2, { g: .12, a: .3 }); AU.tone(233, 2, { g: .1, a: .3 }); AU.whisper(1.2);
  toast(`<span class="tag s">숨겨진 조각</span> <b>${FRAGS[id][0]}</b> (${G.fragments.size}/5)`);
  await say(`{q}[숨겨진 조각 ${G.fragments.size}/5 — ${FRAGS[id][0]}]{/q} ${FRAGS[id][1]}`);
  hud();
}

function overlay(dur, draw, cls = '') {

/* ===================== 명부 · 단서 패널 ===================== */
function visitorRows(mode) {
  const vs = G.visitors.slice(0, Math.min(12, mode === 'verdict' ? 12 : G.arrived));
  let s = `<table class="vt"><tr><th>#</th><th>이름</th><th>관계</th><th>방문 병실</th><th>면회 환자</th><th>도착</th><th>서명</th><th>비고</th>${mode === 'verdict' ? '<th>판정</th>' : ''}</tr>`;
  vs.forEach(v => {
    s += `<tr><td>${v.n}</td><td>${v.name}</td><td>${v.rel}</td><td>${v.room}호</td><td>${v.patient}</td><td>${v.time}</td><td><span class="sig ${v.mirror ? 'm' : ''}">${v.name}</span></td><td>${v.note}</td>`;
    if (mode === 'verdict') s += `<td><button class="tog ${G.mark[v.n] ? 'fake' : ''}" data-n="${v.n}">${G.mark[v.n] ? '가짜' : '사람'}</button></td>`;
    s += '</tr>';
  });
  if (G.arrived >= 13) s += `<tr class="unk"><td>13</td><td>______</td><td>?</td><td>—</td><td>—</td><td>04:44</td><td>—</td><td>노크 13회. 얼굴이 보이지 않음. 당직복 차림.</td>${mode === 'verdict' ? '<td>—</td>' : ''}</tr>`;
  return s + '</table>';
}

  if (!G.logUnlocked) return;

}
function openClues() {
  let s = '';
  if (!G.clues.length) s += '<div class="clue" style="color:#777">아직 찾은 단서가 없다.</div>';
  G.clues.forEach(c => s += `<div class="clue"><span class="tag ${c.kind === '판별' ? 't' : ''}">${c.kind}</span><b>${c.title}</b><br>${c.text}</div>`);
  s += `<h2 style="font-size:16px;margin-top:16px">숨겨진 조각 ${G.fragments.size}/5</h2>`;
  Object.keys(FRAGS).forEach(k => s += G.fragments.has(k) ? `<div class="clue"><span class="tag s">조각</span><b>${FRAGS[k][0]}</b><br>${FRAGS[k][1]}</div>` : `<div class="clue" style="color:#555">??? — 어딘가에서 희미하게 반짝이는 것을 찾아라</div>`);
  openPanel('수집한 단서', s);
}

/* ===================== 최종 판정 ===================== */
function verdict() {
  G.mark = G.mark || {};
  return guard(res => {
    const render = () => {
      const n = Object.values(G.mark).filter(Boolean).length, secret = G.fragments.size === 5;
      $('#verdictB').innerHTML = `<div class="meta">가짜라고 생각하는 방문자를 눌러 <b style="color:#f66">‘가짜’</b>로 표시하라 (현재 ${n}명). 일지에 따르면 가짜는 셋이다.</div>
        <div class="vt-wrap">${visitorRows('verdict')}</div>
        <h2 style="font-size:17px;margin-top:14px">13번째 방문자를 어떻게 할 것인가?</h2>
        <div class="prow" style="margin-top:8px">
          <button class="btn" data-c="refuse">문을 열지 않는다</button>
          <button class="btn ghost" data-c="open">문을 열어 준다</button>
          ${secret ? '<button class="btn" data-c="name" style="border-color:#d8b46a;color:#ffe2a0">명부 13번 칸에 내 이름을 적는다</button>' : '<span style="color:#555;font-size:12px">(숨겨진 조각이 모두 모이면 다른 선택지가 보일지도 모른다…)</span>'}
        </div><div class="msg" id="vMsg"></div>`;
      $('#verdictB').querySelectorAll('.tog').forEach(b => b.onclick = () => { const k = +b.dataset.n; G.mark[k] = !G.mark[k]; AU.tone(300, .08, { g: .05 }); render(); });
      $('#verdictB').querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
        if (n === 0) { $('#vMsg').textContent = '아무도 지목하지 않았다. 정말 모두 사람이라고 확신하는가? (최소 한 명은 지목해야 한다)'; return; }
        $('#verdict').classList.remove('on'); res(b.dataset.c);
      });
    };
    render(); $('#verdict').classList.add('on');
  }).then(choice => {
    const fakes = G.visitors.filter(v => v.fake).map(v => v.n).sort().join(',');
    const marked = Object.keys(G.mark).filter(k => G.mark[k]).map(Number).sort().join(',');
    const ok = fakes === marked;
    const end = !ok ? 'bad' : choice === 'refuse' ? 'true' : choice === 'open' ? 'open' : 'secret';
    return playEnding(end);
  });
}

function drawEndBg(c, w, h, key, t, p) {
  if (key === 'true') { const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1b2440'); g.addColorStop(.6, `rgb(${120 + p * 80},${70 + p * 50},${50})`); g.addColorStop(1, '#0a0806'); c.fillStyle = g; c.fillRect(0, 0, w, h); c.fillStyle = '#050505'; c.fillRect(w * .3, h * .35, w * .4, h * .65); for (let i = 0; i < 12; i++) { c.fillStyle = Math.random() < .02 ? '#ffcc80' : '#120f0c'; c.fillRect(w * (.33 + (i % 4) * .09), h * (.4 + Math.floor(i / 4) * .15), w * .05, h * .08); } }
  else if (key === 'secret') { const g = c.createRadialGradient(w / 2, h * .45, 0, w / 2, h * .45, w * .7); g.addColorStop(0, `rgba(255,240,210,${.25 + p * .5})`); g.addColorStop(1, '#0b0a09'); c.fillStyle = g; c.fillRect(0, 0, w, h); for (let i = 0; i < 13; i++) drawFigure(c, w * (.14 + i * .056), h * .98, h * .35, { alpha: .25 + p * .2, color: '#1a1714' }); }
  else if (key === 'open') { c.fillStyle = '#05080c'; c.fillRect(0, 0, w, h); c.strokeStyle = 'rgba(150,170,195,.25)'; for (let i = 0; i < 120; i++) { const rx = (i * .1379) % 1, ry = (t * 1.7 + i * .371) % 1; c.beginPath(); c.moveTo(rx * w, ry * h); c.lineTo(rx * w - 4, ry * h + h * .05); c.stroke(); } c.fillStyle = 'rgba(200,220,210,.08)'; c.fillRect(w * .3, h * .15, w * .4, h * .85); drawFigure(c, w * .5, h * .9, h * .45, { alpha: .8, color: '#0a0d0c' }); }
  else { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); c.fillStyle = `rgba(120,0,0,${.15 + Math.sin(t * 2) * .05})`; c.fillRect(0, 0, w, h); for (let i = 0; i < 14; i++) drawFigure(c, w * (.06 + i * .067), h * 1.02, h * (.4 + (i % 3) * .05), { eyes: true, eyeColor: '#f22', alpha: .9 }); }
  c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 0, w, h);
}
async function playEnding(key) {
  G.ending = key; G.running = false; G.busy = true;
  const E = ENDINGS[key];
  const got = Store.get('v13_endings', []); if (!got.includes(key)) { got.push(key); Store.set('v13_endings', got); }
  if (key === 'bad') { await SC.face('grin', 900); }
  if (key === 'open') { AU.door(0); await wait(1200); await SC.face('hollow', 700); }
  if (key === 'secret') { AU.silence(2500); await wait(2500); AU.tone(220, 6, { g: .1, a: 2 }); AU.tone(277, 6, { g: .08, a: 2 }); AU.tone(330, 6, { g: .07, a: 2 }); }
  if (key === 'true') { AU.tone(196, 5, { g: .08, a: 2 }); AU.tone(247, 5, { g: .06, a: 2 }); }
  const box = $('#ending'), cv = $('#endCv'), c = cv.getContext('2d'), tx = $('#endText');
  box.classList.add('on'); tx.innerHTML = ''; let alive = true, prog = 0;
  const draw = now => { if (!alive) return; fit(cv); drawEndBg(c, cv.width, cv.height, key, now / 1000, prog); requestAnimationFrame(draw); };
  requestAnimationFrame(draw);
  const clickWait = ms => guard(res => { let done = false; const fin = () => { if (done) return; done = true; box.removeEventListener('click', fin); clearTimeout(tm); res(); }; const tm = setTimeout(fin, ms); box.addEventListener('click', fin); });
  try {
    for (let i = 0; i < E.lines.length; i++) {
      prog = i / E.lines.length; tx.innerHTML = `<div class="ln">${fmtTxt(E.lines[i])}</div>`;
      await wait(60); tx.firstChild.classList.add('on');
      await clickWait(3400 + E.lines[i].length * 45);
      tx.firstChild.classList.remove('on'); await wait(700);
    }
    prog = 1; AU.boom();
    tx.innerHTML = `<div class="ln" id="endTitle" style="color:${E.col}">${E.name}</div><div class="ln" style="color:#bbb;letter-spacing:.3em">${E.sub}</div>`;
    await wait(80); tx.querySelectorAll('.ln').forEach(l => l.classList.add('on'));
    await clickWait(4500);
  } finally { alive = false; box.classList.remove('on'); }
  showSummary(key);
}

/* ===================== 결과 요약 ===================== */
function showSummary(key) {
  const E = ENDINGS[key], got = Store.get('v13_endings', []);
  const fakes = G.visitors.filter(v => v.fake);
  const acc = G.correct + G.wrong ? Math.round(G.correct / (G.correct + G.wrong) * 100) : 0;
  $('#sumB').innerHTML = `
    <div class="meta"><span class="lv">${E.name}</span><span>${E.sub}</span></div>
    <div class="sumgrid">
      <div><small>플레이 시간</small><b>${fmtTime(G.playTime)}</b></div>
      <div><small>정답 / 오답</small><b>${G.correct} / ${G.wrong}</b></div>
      <div><small>정답률</small><b>${acc}%</b></div>
      <div><small>힌트 사용</small><b>${G.hints}</b></div>
      <div><small>수집한 단서</small><b>${G.clues.length}</b></div>
      <div><small>숨겨진 조각</small><b>${G.fragments.size}/5</b></div>
      <div><small>점프스케어</small><b>${G.scares}회</b></div>
      <div><small>남은 정신력</small><b>${Math.round(G.sanity)}</b></div>
    </div>
    <h2 style="font-size:16px">가짜 방문자의 정체</h2>
    ${fakes.map(v => `<div class="clue"><span class="tag t">${TELLS[v.tell].name}</span><b>#${v.n} ${v.name}</b> (${v.room}호 · ${v.time}) — ${TELLS[v.tell].desc} ${G.mark && G.mark[v.n] ? '<span style="color:#9c9">✔ 지목함</span>' : '<span style="color:#f66">✘ 놓침</span>'}</div>`).join('')}
    ${G.mark ? G.visitors.filter(v => !v.fake && G.mark[v.n]).map(v => `<div class="clue" style="color:#d88">#${v.n} ${v.name} — 사람이었다. (잘못 지목)</div>`).join('') : ''}
    <h2 style="font-size:16px;margin-top:14px">엔딩 수집 ${got.length}/4</h2>
    ${endSlots()}
    <div class="prow" style="margin-top:16px;justify-content:center"><button class="btn" id="sAgain">다시 플레이</button><button class="btn ghost" id="sTitle">타이틀로</button></div>`;
  $('#summary').classList.add('on');
  $('#sAgain').onclick = () => { $('#summary').classList.remove('on'); restart(false); };
  $('#sTitle').onclick = () => { $('#summary').classList.remove('on'); restart(true); };
}
function endSlots() {
  const got = Store.get('v13_endings', []);
  return '<div class="endslots">' + Object.entries(ENDINGS).map(([k, E]) => got.includes(k) ? `<div class="got"><b>${E.name}</b>${E.sub}<br><small style="color:#888">${E.hint}</small></div>` : `<div><b>???</b><small style="color:#666">${k === 'secret' ? '병원 곳곳에 숨겨진 무언가가 있다…' : E.hint}</small></div>`).join('') + '</div>';
}

/* ===================== 시작 · 일시정지 · 재시작 ===================== */
function startGame() {
  AU.init();
  abortAll(); G = newState(); genVisitors(); G.running = true;
  $('#title').classList.add('hide'); $('#hud').classList.remove('hide');
  ['#puzzle', '#panel', '#verdict', '#pause', '#confirm', '#summary', '#endsM'].forEach(s => $(s).classList.remove('on'));
  scareEl.className = ''; $('#cctv').classList.remove('on'); $('#ending').classList.remove('on'); $('#dialog').classList.remove('on');
  layout(); hud();
  chapter1().catch(swallow);
}
function restart(toTitle) {
  abortAll(); G = newState(); G.running = false;
  ['#puzzle', '#panel', '#verdict', '#pause', '#confirm', '#summary', '#endsM'].forEach(s => $(s).classList.remove('on'));
  scareEl.className = ''; $('#cctv').classList.remove('on'); $('#ending').classList.remove('on'); $('#dialog').classList.remove('on'); $('#chapCard').classList.remove('on');
  $('#puzzle').style.visibility = ''; cutBlack(false); $('#hotspots').innerHTML = '';
  if (toTitle) { $('#title').classList.remove('hide'); $('#hud').classList.add('hide'); }
  else startGame();
}
function setPause(p) {
  if (!G.running) return;
  G.paused = p; $('#pause').classList.toggle('on', p);
  if (AU.ok()) { if (p) AU.ctx.suspend && AU.ctx.suspend(); else AU.ctx.resume && AU.ctx.resume(); }
}
function toggleMute() {
  AU.setMute(!AU.muted);
  const t = AU.muted ? '소리 꺼짐' : '소리 켜짐';
  $('#bMute').textContent = t; $('#tMute').textContent = '소리: ' + (AU.muted ? '꺼짐' : '켜짐'); $('#pzMute').textContent = AU.muted ? '소리 켜기' : '소리 끄기';
}
$('#tStart').onclick = startGame;
$('#tMute').onclick = toggleMute;
$('#tEnds').onclick = () => { $('#endsB').innerHTML = `<div class="meta">달성 ${Store.get('v13_endings', []).length}/4</div>` + endSlots(); $('#endsM').classList.add('on'); };
$('#endsX').onclick = () => $('#endsM').classList.remove('on');
$('#bMute').onclick = toggleMute; $('#pzMute').onclick = toggleMute;
$('#bPause').onclick = () => setPause(true);
$('#pzResume').onclick = () => setPause(false);
$('#pzRestart').onclick = () => { $('#confirm').classList.add('on'); };
$('#pzTitle').onclick = () => restart(true);
$('#bRestart').onclick = () => { if (G.running) { G.paused = true; } $('#confirm').classList.add('on'); };
$('#cfYes').onclick = () => restart(false);
$('#cfNo').onclick = () => { $('#confirm').classList.remove('on'); if (!$('#pause').classList.contains('on')) G.paused = false; };
$('#bClue').onclick = openClues;
$('#bLog').onclick = openLog;
$('#bHint').onclick = () => {
  if (!G.running) return;
  G.hints++; hud();
  const left = [...document.querySelectorAll('.hs:not(.secret):not(.done)')];
  left.forEach(b => { b.classList.remove('hl'); void b.offsetWidth; b.classList.add('hl'); setTimeout(() => b.classList.remove('hl'), 2600); });
  toast(left.length ? `💡 아직 조사하지 않은 곳이 <b>${left.length}곳</b> 있다. (붉게 빛나는 곳)<br>${G.objective || ''}` : `💡 ${G.objective || '대사를 끝까지 읽어 보자.'}`);
};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#panel').classList.contains('on')) $('#panel').classList.remove('on'); else if (G.running) setPause(!G.paused); }
  if ((e.key === ' ' || e.key === 'Enter') && UI.dlgClick && !G.paused) { e.preventDefault(); UI.dlgClick(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G.running && !G.paused) setPause(true); });
$('#main').addEventListener('click', () => { if (UI.dlgClick && !G.paused) UI.dlgClick(); });

/* 부팅 */
G = newState();
layout();
requestAnimationFrame(loop);

</script>
